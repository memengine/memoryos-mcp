[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryo-mcp"
version = "0.4.0"
description = "Model Context Protocol server for governed MemoryOS context."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "MemoryO", email = "support@memoryo.dev" },
]
requires-python = ">=3.11"
keywords = ["ai", "agents", "memory", "governance", "mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "fastmcp>=2.0",
]

[project.urls]
Homepage = "https://memoryo.dev"
Documentation = "https://docs.memoryo.dev/sdk/mcp"

[project.scripts]
memoryo-mcp = "memoryos_mcp.server:main"

[tool.setuptools.packages.find]
include = ["memoryos_mcp*"]
