apiVersion: apps/v1
kind: Deployment
metadata:
  name: memoryos-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memoryos-mcp
  template:
    metadata:
      labels:
        app: memoryos-mcp
    spec:
      containers:
        - name: memoryos-mcp
          image: your-registry/memoryos-mcp:0.2.0
          env:
            - name: MEMORYOS_API_URL
              value: https://api.memoryo.dev
            - name: MEMORYOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: memoryos-mcp
                  key: api-key
            - name: MEMORYOS_MCP_TRANSPORT
              value: streamable-http
            - name: MEMORYOS_MCP_EXPOSURE
              value: private
            - name: MEMORYOS_MCP_HOST
              value: 0.0.0.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: memoryos-mcp
spec:
  type: ClusterIP
  selector:
    app: memoryos-mcp
  ports:
    - port: 8080
      targetPort: 8080
